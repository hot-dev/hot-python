name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Build
        run: python -m build

  integration:
    name: Integration (hot dev)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Install hot
        uses: hot-dev/setup-hot@v1

      - name: Run integration tests
        run: ./integration/run.sh

  postgres-isolation:
    name: PostgreSQL Sub-org Isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_NET_RETRY: "2"
      SQLX_OFFLINE: "true"
    steps:
      - name: Checkout SDK
        uses: actions/checkout@v5

      # A released CLI may lag these API changes. Pin the tested server source
      # separately so its schema, runtime qualification, and OpenAPI agree.
      - name: Read matching Hot revision
        id: hot-ref
        shell: bash
        run: |
          revision="$(cat integration/hot-server.ref)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "integration/hot-server.ref must contain a full commit SHA" >&2
            exit 1
          fi
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"

      - name: Checkout matching Hot server
        uses: actions/checkout@v5
        with:
          repository: hot-dev/hot
          ref: ${{ steps.hot-ref.outputs.revision }}
          path: .hot-server
          persist-credentials: false

      - name: Set up Python for the fixture
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build and PostgreSQL client dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev cmake clang lld postgresql-client
          docker version

      - name: Install server Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"

      - name: Cache matching server build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hot-server -> target
          key: postgres-isolation-${{ steps.hot-ref.outputs.revision }}
          cache-workspace-crates: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Tailwind for the server build
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hot-sdk-bin"
          curl -fsSL --retry 3 \
            https://github.com/tailwindlabs/tailwindcss/releases/download/v4.3.0/tailwindcss-linux-x64 \
            -o "$RUNNER_TEMP/hot-sdk-bin/tailwindcss"
          chmod +x "$RUNNER_TEMP/hot-sdk-bin/tailwindcss"
          echo "$RUNNER_TEMP/hot-sdk-bin" >> "$GITHUB_PATH"

      - name: Build matching Hot CLI
        working-directory: .hot-server
        run: cargo build --locked --package hot_cli --jobs 4

      - name: Install Python SDK dependencies
        run: python -m pip install -e ".[dev]"

      - name: Test PostgreSQL isolation with restricted runtime credentials
        run: |
          python3 integration/suborg_fixture.py \
            --backend postgres \
            --hot .hot-server/target/debug/hot \
            --hot-repo .hot-server \
            -- python -m pytest tests/test_suborg_integration.py -v
